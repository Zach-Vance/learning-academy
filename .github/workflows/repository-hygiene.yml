name: Repository hygiene
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Reject private artifacts
        run: python3 scripts/check-repository-hygiene.py
      - name: Scan reachable history
        env:
          GITLEAKS_VERSION: v8.30.1
        run: |
          version="${GITLEAKS_VERSION#v}"
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$base/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${version}_checksums.txt" --output "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive$" checksums.txt | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact --config=.gitleaks.toml
